name: golfiq-db-test

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: golfiq_test
      POSTGRES_PASSWORD: golfiq_test_only
      POSTGRES_DB: golfiq_test
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golfiq_test -d golfiq_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
