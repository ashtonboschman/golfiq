name: Pull Request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:1/golfiq?schema=public
      NEXTAUTH_SECRET: ci-only-placeholder-not-a-production-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      RESEND_API_KEY: re_ci_placeholder
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full verification
        run: npm run verify:full
